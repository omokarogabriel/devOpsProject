# Cilium Helm Values
# Install with: helm install cilium cilium/cilium -f values.yaml --namespace kube-system --version 1.19.0
#
# NOTE: BGP Control Plane is disabled by default. It requires physical/virtual
# routers to peer with and will block agent startup on kind/minikube clusters
# because the operator cannot register BGP CRDs without a BGP-capable environment.
# Enable only on bare-metal or cloud clusters with BGP support.

# Cluster Configuration
cluster:
  name: kind-cilium

# IPAM Configuration
ipam:
  mode: kubernetes

# Routing Configuration
routingMode: tunnel
tunnelProtocol: vxlan

# Operator Configuration
operator:
  replicas: 1
  prometheus:
    enabled: true

# Hubble Observability
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp

# WireGuard Encryption
encryption:
  enabled: true
  type: wireguard

# Prometheus Metrics
prometheus:
  enabled: true

# BGP Control Plane (requires physical/virtual routers to peer with)
# Uncomment for bare-metal or cloud environments with BGP support
# bgpControlPlane:
#   enabled: true

# Ingress Controller
# ingressController:
#   enabled: true

# Egress Gateway
# egressGateway:
#   enabled: true
